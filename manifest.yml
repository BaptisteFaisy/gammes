# Gammes — manifeste Forge (Atlassian Codegeist 2026)
#
# Validé contre le schéma officiel `@forge/manifest` (13.9.0) par
# `tools/check-manifest.mjs`, lancé en CI : le manifeste est un fichier de
# garde, pas une intention. Les formes retenues ici sont celles du schéma :
#
#   - les modules Rovo passent par des modules `action` (une action par outil
#     MCP du § 18) ; `rovo:mcp.tools` et `rovo:agent.actions` y renvoient par
#     clé — une seule source de vérité, la base ;
#   - les surfaces partagent UNE ressource (`static/main/index.html`) et se
#     distinguent par leur clé de module ; le rendu est en UI Kit 2 ;
#   - `jira:workflowValidator` est une **fonction** (le validateur exige une
#     trace d'exécution close liée au ticket), pas une expression.

modules:
  # --- Fonctions : le point d'entrée unique, et le validateur de transition ---
  function:
    - key: gammes-fn
      handler: index.handler
    - key: gammes-validator-fn
      handler: validator.handler

  remote:
    - key: gammes-resolver
      function: gammes-fn

  # --- Outils MCP : une action par outil du § 18 ---
  action:
    - key: find-procedure
      name: Trouver une procédure
      description: "Chercher une gamme par intention ou contexte."
      actionType: gammes:procedure:find
      function: gammes-fn
    - key: check-before-acting
      name: Vérifier avant d'agir
      description: "Existe-t-il une gamme pour ce geste ? Verrous et permis requis."
      actionType: gammes:procedure:check
      function: gammes-fn
    - key: get-procedure
      name: Lire une procédure
      description: "Étapes, entrées, preuves, verrous et provenance d'une gamme."
      actionType: gammes:procedure:get
      function: gammes-fn
    - key: list-procedures
      name: Lister les procédures
      description: "Le registre filtré : espace, état, fraîcheur."
      actionType: gammes:procedure:list
      function: gammes-fn
    - key: start-run
      name: Démarrer une exécution
      description: "Démarrer une exécution épinglée à sa version."
      actionType: gammes:run:start
      function: gammes-fn
    - key: get-current-step
      name: Étape courante
      description: "L'étape courante, sa preuve et ses verrous."
      actionType: gammes:run:current-step
      function: gammes-fn
    - key: record-step
      name: Acquitter une étape
      description: "Acquitter l'étape avec sa preuve, ou recevoir le refus du verrou."
      actionType: gammes:run:record-step
      function: gammes-fn
    - key: report-deviation
      name: Déclarer une déviation
      description: "Déclarer ce qui a été fait à la place, et pourquoi."
      actionType: gammes:run:report-deviation
      function: gammes-fn
    - key: finish-run
      name: Clore l'exécution
      description: "Clore l'exécution et rendre la trace citable."
      actionType: gammes:run:finish
      function: gammes-fn
    - key: get-run-trace
      name: Lire la trace
      description: "La trace complète d'une exécution."
      actionType: gammes:run:trace
      function: gammes-fn
    - key: get-procedure-stats
      name: Statistiques d'étape
      description: "Échecs, sauts, déviations par étape, avec effectifs."
      actionType: gammes:stats:procedure
      function: gammes-fn
    - key: propose-amendment
      name: Proposer un amendement
      description: "Proposer un amendement (jamais appliqué seul)."
      actionType: gammes:amendment:propose
      function: gammes-fn
    - key: compile-page
      name: Compiler une page
      description: "Compiler une page en brouillon de gamme + diff. Rien n'est publié."
      actionType: gammes:page:compile
      function: gammes-fn
    - key: export-skill
      name: Exporter le SKILL.md
      description: "Le SKILL.md d'une gamme approuvée, en source ouverte."
      actionType: gammes:skill:export
      function: gammes-fn
    - key: get-missing-procedures
      name: Gammes manquantes
      description: "Les gammes fantômes, avec preuves et coût."
      actionType: gammes:ghost:list
      function: gammes-fn
    - key: get-conflicts
      name: Conflits de procédures
      description: "Les conflits détectés, passages cités de part et d'autre."
      actionType: gammes:conflict:list
      function: gammes-fn

  rovo:mcp:
    - key: gammes-mcp
      name: Gammes
      tools:
        - find-procedure
        - check-before-acting
        - get-procedure
        - list-procedures
        - start-run
        - get-current-step
        - record-step
        - report-deviation
        - finish-run
        - get-run-trace
        - get-procedure-stats
        - propose-amendment
        - compile-page
        - export-skill
        - get-missing-procedures
        - get-conflicts

  # --- Skill générique : la conduite attendue de tout agent ---
  rovo:skill:
    - key: derouler-une-gamme
      description: >-
        Chercher une gamme avant d'agir, demander les entrées typées, acquitter
        chaque étape avec sa preuve, déclarer toute déviation, s'arrêter net au
        premier verrou humain ou de permis, ne jamais improviser une étape à
        risque, citer la version dans le compte rendu.
      source:
        dir: skills/derouler-une-gamme
      dependencies:
        tools:
          - find-procedure
          - start-run
          - record-step
          - report-deviation

  # --- Agent Rovo « Le compagnon » ---
  rovo:agent:
    - key: le-compagnon
      name: Le compagnon
      description: Déroule une gamme sous supervision et refuse d'improviser.
      prompt: agents/le-compagnon.md
      conversationStarters:
        - Quelle procédure pour déployer ce service en production ?
        - Quelles gammes sont désynchronisées de leur page ?
        - Quelle étape échoue le plus ce trimestre ?
      actions:
        - find-procedure
        - check-before-acting
        - get-procedure
        - list-procedures
        - start-run
        - get-current-step
        - record-step
        - report-deviation
        - finish-run
        - get-run-trace
        - get-procedure-stats
        - propose-amendment
        - compile-page
        - export-skill
        - get-missing-procedures
        - get-conflicts
      skills:
        - derouler-une-gamme

  # --- Surfaces Confluence ---
  confluence:globalPage:
    - key: gammes-atelier
      title: Gammes — Atelier
      route: atelier
      resource: main
  confluence:contentAction:
    - key: gammes-page-action
      title: Gammes
      resource: main
  macro:
    - key: gammes-macro
      title: État de la gamme
      description: Version, état, exécutions et fraîcheur de la gamme compilée depuis cette page.
      resource: main
  confluence:spaceSettings:
    - key: gammes-settings
      title: Gammes — Réglages
      route: reglages
      resource: main

  # --- Surfaces Jira ---
  jira:issuePanel:
    - key: gammes-issue-panel
      title: Gammes
      icon: https://baptistefaisy.github.io/gammes/icon.png
      resource: main
  jira:globalPage:
    - key: gammes-registre-jira
      title: Gammes — Registre
      resource: main
  jira:workflowValidator:
    - key: gammes-trace-validator
      name: Gammes trace required
      description: Refuse la transition tant qu'aucune trace d'exécution close n'est liée au ticket.
      function: gammes-validator-fn
      errorMessage: >-
        Gammes : cette transition exige une trace d'exécution close liée au
        ticket. Déroulez la gamme applicable, liez la trace, puis rejouez.

  # --- Événements, planifications, traitements longs, entrée externe signée ---
  trigger:
    - key: gammes-page-events
      function: gammes-fn
      events:
        - avi:confluence:page:added
        - avi:confluence:page:updated
        - avi:confluence:page:deleted
        - avi:jira:issue:commented
        - avi:jira:issue:linked
  scheduledTrigger:
    - key: gammes-nightly
      function: gammes-fn
      interval: day
  consumer:
    - key: gammes-consumer-compile
      queue: gammes-compile
      function: gammes-fn
    - key: gammes-consumer-stats
      queue: gammes-recompute-stats
      function: gammes-fn
    - key: gammes-consumer-ghosts
      queue: gammes-detect-ghosts
      function: gammes-fn
    - key: gammes-consumer-conflicts
      queue: gammes-detect-conflicts
      function: gammes-fn
  webtrigger:
    - key: gammes-hook
      function: gammes-fn

  sql:
    - key: gammes-sql
      engine: mysql

  llm:
    - key: gammes-llm
      model:
        - claude

resources:
  - key: main
    path: static/main

app:
  id: ari:cloud:ecosystem::app/0af99e1d-b8f8-494e-85c2-e51cd20cad4a
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - read:confluence-content.all
    - write:confluence-content
    - read:confluence-props
    - read:space:confluence
    - write:confluence-props
    - read:confluence-user
    - read:confluence-content.permission
    - storage:app
    - read:attachment:confluence
    - read:graph:page:confluence
    - read:graph:project:atlassian
    - read:issue-details:jira
    - read:jira-work
    - write:jira-work
    - write:issue:jira
    - manage:jira-configuration
  content:
    styles:
      - unsafe-inline
  external:
    fetch:
      client:
        - address: api.inferhub.dev
