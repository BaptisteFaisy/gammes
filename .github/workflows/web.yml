name: web

on:
  push:
    branches: [main]
  workflow_dispatch:

# Verdict rapide : build + déploiement Pages, budget 5 minutes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: House rules + typecheck (le site importe le vrai cœur)
        run: |
          npm run lint
          npm run typecheck

      - name: Preuves réelles (modèle réel + suite de tests, via le secret du dépôt)
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
          INFERHUB_BASE_URL: ${{ vars.INFERHUB_BASE_URL }}
          INFERHUB_MODEL: ${{ vars.INFERHUB_MODEL }}
        run: |
          npx tsx scripts/generate-preuves.ts || echo "::warning::preuves non générées — le site affichera « test à vérifier »"

      - name: Build site
        run: npm run build:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
